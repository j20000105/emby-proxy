name: Build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned toolchain and musl linker
        run: |
          rustup show
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends musl-tools
      - name: Format, lint and unit tests
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Build static binary and exercise proxy protocol
        run: |
          cargo build --release --locked --target x86_64-unknown-linux-musl
          python3 tests/protocol.py target/x86_64-unknown-linux-musl/release/emby-proxy
          file target/x86_64-unknown-linux-musl/release/emby-proxy
          if readelf -l target/x86_64-unknown-linux-musl/release/emby-proxy | grep -q INTERP; then
            echo 'Binary unexpectedly requires a dynamic loader' >&2
            exit 1
          fi
          ./scripts/package.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: emby-proxy-linux-x86_64-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: emby-proxy-linux-x86_64-${{ github.sha }}
          path: dist
      - name: Publish verified release files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum -c emby-proxy-x86_64-unknown-linux-musl.tar.gz.sha256
          printf 'Static Linux x86_64 binary. Source commit: %s\n' "$GITHUB_SHA" > ../release-notes.txt
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file ../release-notes.txt ./*
